[package]
name = "mans-desktop"
version = "0.1.0"
edition = "2021"
description = "MANS native macOS mission planning workstation"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
egui-wgpu = "0.31.1"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["tiff"] }
mans-nav = { path = "../../crates/mans-nav" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
